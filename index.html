<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'><meta name='theme-color' content='#0b2545'><meta name='mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><link rel='manifest' href='manifest.webmanifest'><link rel='icon' href='icon-192.png'><link rel='apple-touch-icon' href='icon-192.png'><title>Water Operator Flashcards</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#071426,#0b2545 55%,#134074);color:#fff;min-height:100vh}.app{max-width:720px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{background:#ffffff18;border:1px solid #ffffff28;padding:8px 12px;border-radius:999px}.card{margin:24px 0;background:#fff;color:#10243d;border-radius:24px;min-height:330px;padding:28px;box-shadow:0 18px 50px #0005;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}.formula{font-size:54px;font-weight:800}.name{font-size:28px;font-weight:750;margin:8px}.use,.math{font-size:18px;margin:10px 0;line-height:1.45}.hint{opacity:.65;margin-top:20px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.controls.three{grid-template-columns:1fr 1fr 1fr;margin-top:12px}button{border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:750;background:#fff;color:#0b2545}button.alt{background:#ffffff18;color:#fff;border:1px solid #ffffff2c}.quiz{background:#ffffff12;border:1px solid #ffffff22;border-radius:18px;padding:16px;margin-top:18px}.quiz input{width:100%;padding:13px;border-radius:12px;border:0;font-size:17px;margin:8px 0}.result{min-height:26px;font-weight:700}.small{font-size:13px;opacity:.72}h1{font-size:24px;margin:0}.hidden{display:none}@media(max-width:450px){.formula{font-size:45px}.card{min-height:310px;padding:22px}.controls.three{grid-template-columns:1fr}}
</style></head><body><main class='app'><div class='top'><div><h1>💧 Water Operator Flashcards</h1><div class='small'>Chemical names • uses • operator math</div></div><div class='pill' id='counter'></div></div>
<div class='card' id='card' onclick='flip()'><div id='front'><div class='formula' id='formula'></div><div class='hint'>Tap card to reveal</div></div><div id='back' class='hidden'><div class='name' id='name'></div><div class='use' id='use'></div><div class='math' id='math'></div><div class='hint'>Tap to show formula</div></div></div>
<div class='controls'><button onclick='prev()'>← Previous</button><button onclick='next()'>Next →</button></div><div class='controls three'><button class='alt' onclick='shuffle()'>🔀 Shuffle</button><button class='alt' onclick='toggleQuiz()'>🧪 Quiz Me</button><button class='alt' onclick='resetProgress()'>↻ Reset</button></div>
<section class='quiz hidden' id='quiz'><b id='qtext'></b><input id='answer' placeholder='Type the chemical name…' autocomplete='off'><button onclick='check()'>Check Answer</button><div class='result' id='result'></div><div class='small' id='score'></div></section>
<script>
const cards=[
{f:'NaOH',n:'Sodium Hydroxide (Caustic Soda)',u:'Use: Raises pH and can increase alkalinity.',m:'Math idea: adding a base generally drives pH upward.'},
{f:'Ca(OH)₂',n:'Calcium Hydroxide (Lime)',u:'Use: Lime softening; raises pH and helps remove hardness.',m:'Remember: Ca = calcium; OH = hydroxide.'},
{f:'H₂SO₄',n:'Sulfuric Acid',u:'Use: Lowers pH; may be used for pH control.',m:'Math idea: acid addition generally drives pH downward.'},
{f:'NH₃',n:'Ammonia',u:'Use: Reacts with chlorine in chloramination.',m:'Ratio: Cl₂ ÷ NH₃. If NH₃ rises while Cl₂ stays fixed, the ratio falls.'},
{f:'Cl₂',n:'Chlorine',u:'Use: Disinfection and oxidation.',m:'Chlorine demand = Dose − Residual.'},
{f:'NH₂Cl',n:'Monochloramine (Chloramine)',u:'Use: Combined-chlorine disinfectant formed from chlorine and ammonia.',m:'Remember the atoms: N + H₂ + Cl.'},
{f:'NaOCl',n:'Sodium Hypochlorite',u:'Use: Liquid chlorine/bleach disinfectant; supplies available chlorine.',m:'Na = sodium; OCl = hypochlorite.'},
{f:'H₃PO₄',n:'Phosphoric Acid',u:'Use: Phosphate source and/or pH adjustment depending on the plant process.',m:'H = hydrogen, P = phosphorus, O = oxygen.'},
{f:'CaCO₃',n:'Calcium Carbonate',u:'Use/meaning: Common reference basis for hardness and alkalinity reporting.',m:'Often reported as mg/L as CaCO₃.'},
{f:'H₂O',n:'Water',u:'Two hydrogen atoms bonded with one oxygen atom.',m:'H₂ = 2 H; O = 1 O.'},
{f:'lb/day',n:'Chemical Feed Formula',u:'Find pounds of chemical per day from concentration and flow.',m:'lb/day = mg/L × MGD × 8.34'},
{f:'Demand',n:'Chlorine Demand',u:'Amount of chlorine consumed before the measured residual remains.',m:'Demand = Dose − Residual. Example: 8 − 2 = 6 mg/L.'},
{f:'1 MGD',n:'One Million Gallons per Day',u:'Flow unit commonly used in water treatment.',m:'1 MGD = 1,000,000 gal/day.'},
{f:'Cl₂:NH₃',n:'Chlorine-to-Ammonia Ratio',u:'Compares chlorine dose with ammonia dose.',m:'Ratio = Cl₂ dose ÷ NH₃ dose. Example: 5 ÷ 1 = 5:1.'}
];
let i=+(localStorage.idx||0), flipped=false, correct=+(localStorage.correct||0),attempts=+(localStorage.attempts||0);
function render(){i=(i+cards.length)%cards.length;const c=cards[i];formula.textContent=c.f;name.textContent=c.n;use.textContent=c.u;math.textContent=c.m;front.classList.remove('hidden');back.classList.add('hidden');flipped=false;counter.textContent=`${i+1} / ${cards.length}`;localStorage.idx=i;updateScore()}
function flip(){flipped=!flipped;front.classList.toggle('hidden',flipped);back.classList.toggle('hidden',!flipped)} function next(){i++;render()} function prev(){i--;render()}
function shuffle(){i=Math.floor(Math.random()*cards.length);render()} function toggleQuiz(){quiz.classList.toggle('hidden');newQ()}
function newQ(){let c=cards[i];qtext.textContent=`What is ${c.f}?`;answer.value='';result.textContent='';answer.focus()}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'')} function check(){attempts++;let target=cards[i].n.split('(')[0].trim();if(norm(answer.value)===norm(target)||norm(cards[i].n).includes(norm(answer.value))&&norm(answer.value).length>4){correct++;result.textContent='✅ Correct!';setTimeout(()=>{i++;render();newQ()},700)}else{result.textContent=`❌ Answer: ${cards[i].n}`;}localStorage.correct=correct;localStorage.attempts=attempts;updateScore()}
function updateScore(){score.textContent=`Quiz score: ${correct} correct out of ${attempts} attempts`}
function resetProgress(){localStorage.clear();i=0;correct=attempts=0;render()} answer.addEventListener('keydown',e=>{if(e.key==='Enter')check()});render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));}
</script></main></body></html>
